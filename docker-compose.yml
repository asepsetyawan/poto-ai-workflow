services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-workflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_workflow
    ports:
      - '5432:5432'
    volumes:
      - ai-workflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai-workflow-postgres-data:
